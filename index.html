<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ci Chat's</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
@font-face{font-family:"iOS Emoji";src:url("fonts/NotoColorEmoji.ttf") format("truetype");font-display:swap}
:root{--bg:#EAF2FC;--sf:#fff;--tx:#16263A;--mu:#73869C;--ac:#2F7CF0;--me:#CFE4FF;--ln:#DDE8F5;--tk:#8EA2B8;--rd:#34B7F1;--ok:#34C759;--er:#E0474C;color-scheme:light}
[data-theme=dark]{--bg:#0A1522;--sf:#122033;--tx:#E6EEF8;--mu:#8198B4;--ac:#5CA8FF;--me:#1E3D62;--ln:#1D3149;--tk:#5F7796;--rd:#53BDEB;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:500 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"iOS Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;display:inline-grid;place-items:center}
input{outline:none}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.sb{justify-content:space-between}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--mu)}
.sm{font-size:13px}
.pad{padding:16px}
.screen{height:100%;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--sf);border-radius:22px;padding:28px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(30,80,150,.1)}
.card h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
.card p{margin:0}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
input:focus{border-color:var(--ac)}
.row input{flex:1;min-width:0;width:auto}
.btn{display:block;width:100%;padding:12px 16px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;text-align:center}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;white-space:nowrap}
.btn.gh{background:var(--bg);color:var(--ac)}
.btn:disabled{opacity:.5}
.lk{color:var(--ac);font-size:15px;text-align:center;display:block;padding:2px}
.err{color:var(--er);font-size:14px;min-height:1em}
.ok{color:var(--ac);font-size:14px;min-height:1em}
.av{width:44px;height:44px;border-radius:50%;background:var(--me);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.big .av{width:72px;height:72px;font-size:28px}
.wrap{position:relative;flex:none}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--sf)}
.layout{height:100%;display:grid;grid-template-columns:340px 1fr}
.side{background:var(--sf);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.main{display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.main::before{content:"";position:absolute;inset:-24px;background:var(--wall,none) center/cover no-repeat;filter:var(--wblur,none);z-index:0}
.main>*{position:relative;z-index:1}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln);min-height:64px}
.iconbtn{width:38px;height:38px;border-radius:50%;color:var(--ac);flex:none}
.iconbtn:hover{background:var(--bg)}
.list{overflow:auto;flex:1}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.item:hover,.item.on{background:var(--bg)}
.badge{background:var(--ac);color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 7px;font-size:12px;font-weight:700;display:grid;place-items:center}
#empty{margin:auto;color:var(--mu);text-align:center;padding:20px}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:var(--sf);color:var(--mu);font-size:12px;padding:4px 12px;border-radius:999px;margin:6px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub{max-width:min(78%,520px);padding:8px 12px 6px;border-radius:18px;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:var(--me);border-bottom-right-radius:6px}
.theirs{align-self:flex-start;background:var(--sf);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--mu);margin-top:2px;white-space:nowrap}
.tk{width:16px;height:12px;flex:none}
.media{display:block;width:240px;max-width:100%;border-radius:12px;cursor:zoom-in}
.composer{display:flex;align-items:center;gap:6px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--ln)}
.composer input{flex:1;min-width:0;padding:10px 14px;border-radius:999px;border:1px solid var(--ln);background:var(--bg)}
.emo{display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--sf);border-top:1px solid var(--ln)}
.emo button{width:40px;height:40px;font-size:24px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{width:100%;max-width:400px;background:var(--sf);border-radius:22px;padding:22px;display:grid;gap:10px;max-height:90vh;overflow:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:3px}
.seg button{padding:8px;border-radius:10px;display:block}
.seg button.on{background:var(--sf);color:var(--ac);font-weight:700}
#status.isOn{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--sf);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
@media (max-width:760px){.layout{grid-template-columns:1fr}body.chatopen .side{display:none}body:not(.chatopen) .main{display:none}}
</style>
</head>
<body>
<div class="toast hide" id="toast"></div>

<section class="screen" id="auth">
  <form class="card" id="af" novalidate>
    <h1 id="at">Ci Chat's</h1>
    <p class="muted" id="as"></p>
    <input type="text" id="nick" data-m="signup" placeholder="Nickname" maxlength="30">
    <input type="text" id="uid" data-m="signup" placeholder="ID unik (a–z, 0–9, _)" maxlength="20" autocapitalize="off" autocomplete="off">
    <input type="email" id="email" data-m="login signup forgot verify" placeholder="Alamat Gmail" autocomplete="email">
    <input type="password" id="pass" data-m="login signup recovery" placeholder="Password (min. 6 karakter)" minlength="6" autocomplete="current-password">
    <p class="err" id="ae"></p>
    <p class="ok" id="ao"></p>
    <button class="btn" id="ab" type="submit"></button>
    <a class="lk" href="#" data-m="login" data-go="signup">Buat akun baru</a>
    <a class="lk" href="#" data-m="login" data-go="forgot">Lupa password?</a>
    <a class="lk" href="#" data-m="login" data-go="verify">Verifikasi email</a>
    <a class="lk" href="#" data-m="signup forgot verify" data-go="login">Kembali ke masuk</a>
  </form>
</section>

<section class="layout hide" id="app">
  <aside class="side">
    <div class="bar">
      <div class="wrap" id="me-av" title="Profil" style="cursor:pointer"></div>
      <div class="grow"><b class="trunc" id="me-name"></b><div class="sm muted trunc" id="me-id"></div></div>
      <button class="iconbtn" id="theme" title="Ganti tema" data-i="moon"></button>
      <button class="iconbtn" id="logout" title="Keluar" data-i="logout"></button>
    </div>
    <div style="padding:10px 12px"><input type="text" id="search" placeholder="Cari ID atau nickname" autocomplete="off"></div>
    <div id="results"></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main">
    <div id="empty">Pilih chat atau cari teman untuk mulai ngobrol.</div>
    <div class="chat hide" id="chat">
      <div class="bar">
        <button class="iconbtn" id="back" title="Kembali" data-i="back"></button>
        <div class="wrap" id="hav"></div>
        <div class="grow"><b class="trunc" id="hname"></b><div class="sm muted trunc" id="status"></div></div>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="emo hide" id="emo"></div>
      <form class="composer" id="composer">
        <button type="button" class="iconbtn" id="btn-clip" title="Kirim foto" data-i="clip"></button>
        <button type="button" class="iconbtn" id="btn-emo" title="Emoji" data-i="smile"></button>
        <input type="text" id="txt" placeholder="Tulis pesan" autocomplete="off" maxlength="2000">
        <button class="iconbtn" title="Kirim" style="color:var(--ac)" data-i="send"></button>
      </form>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
    </div>
  </main>
</section>

<div class="modal hide" id="modal">
  <div class="sheet">
    <div class="row sb"><b style="font-size:18px">Profil</b><button class="iconbtn" id="mx" title="Tutup" data-i="x"></button></div>
    <div class="row"><div class="big" id="p-av"></div><button class="btn sm gh" id="p-pick">Ganti foto</button><input type="file" id="p-file" accept="image/jpeg,image/png,image/webp,image/gif" hidden></div>
    <span class="sm muted">Nickname</span>
    <div class="row"><input type="text" id="p-nick" maxlength="30"><button class="btn sm" id="p-nick-save">Simpan</button></div>
    <span class="sm muted">ID unik (boleh diganti 3 hari sekali)</span>
    <div class="row"><input type="text" id="p-uid" maxlength="20" autocapitalize="off"><button class="btn sm" id="p-uid-save">Ganti</button></div>
    <span class="sm muted">Tema</span>
    <div class="seg" id="p-theme"><button data-t="light">Terang</button><button data-t="dark">Gelap</button></div>
    <span class="sm muted">Wallpaper chat</span>
    <div class="row"><button class="btn sm gh" id="w-pick">Pilih dari galeri</button><button class="btn sm gh" id="w-clear">Hapus</button><input type="file" id="w-file" accept="image/*" hidden></div>
    <div class="row hide" id="w-choice"><span class="sm muted grow">Tampilan:</span><button class="btn sm" data-wb="0">Normal</button><button class="btn sm" data-wb="1">Blur</button><button class="btn sm gh" id="w-cancel">Batal</button></div>
  </div>
</div>

<script>
const SB_URL='https://rxydkooczxrwqqrbjaly.supabase.co';
const SB_KEY='sb_publishable_qHhIQ5xgOA3qZ1EOIzSp4Q_6r_g1n31';
const sb=supabase.createClient(SB_URL,SB_KEY);

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I={
 clip:'<svg viewBox="0 0 24 24"><path d="M21 11.5 12.5 20a5.5 5.5 0 0 1-7.8-7.8L13 4.9a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>',
 send:'<svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>',
 smile:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
 moon:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 logout:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>'
};
document.querySelectorAll('[data-i]').forEach(b=>b.innerHTML=I[b.dataset.i]);
const EMOJI='😀 😂 😍 🥰 😎 🤔 😭 😅 🙏 👍 👏 🙌 🔥 🎉 ❤️ 😊 😴 👋'.split(' ');

const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const isToday=t=>new Date(t).toDateString()===new Date().toDateString();
const short=t=>isToday(t)?hm(t):new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short'});
const seen=t=>isToday(t)?hm(t):new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const dayLabel=t=>{
 const d=new Date(t),n=new Date(),diff=Math.round((new Date(n.toDateString())-new Date(d.toDateString()))/864e5);
 return diff===0?'Hari ini':diff===1?'Kemarin':d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
};
const preview=m=>!m?'Belum ada pesan':m.kind==='image'?'Foto':m.body;
const av=p=>`<div class="av">${p?.avatar_path?`<img src="${sb.storage.from('avatars').getPublicUrl(p.avatar_path).data.publicUrl}" alt="">`:esc((p?.nickname||'?').charAt(0).toUpperCase())}</div>`;

function humanErr(e){
 const m=(e?.message||'').toLowerCase();
 if(m.includes('invalid login'))return 'Email atau password salah.';
 if(m.includes('not confirmed'))return 'Email belum diverifikasi. Cek inbox lalu klik tautan verifikasi.';
 if(m.includes('already registered'))return 'Email sudah terdaftar. Silakan masuk.';
 if(m.includes('gmail'))return 'Gunakan alamat Gmail.';
 if(m.includes('rate limit')||m.includes('too many'))return 'Terlalu sering mencoba. Tunggu beberapa menit.';
 return e?.message||'Terjadi kesalahan. Coba lagi.';
}
function uidErr(e){
 const m=e?.message||'';
 if(m.includes('COOLDOWN'))return 'ID hanya bisa diganti 3 hari sekali.';
 if(m.includes('TAKEN'))return 'ID sudah dipakai. Pilih ID lain.';
 if(m.includes('FORMAT'))return 'ID harus 3–20 karakter: huruf kecil, angka, atau _.';
 return humanErr(e);
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),3200);}

let me=null,profile=null,mode='login',recovering=false,chan=null,curId=null,curOther=null,msgs=new Map(),convs=[],pendingHTML='',typingOn=false,typingT,lt,stm,lastT=0,pendingWall=null;
const online=new Set(),urlCache=new Map();

/* ---------- AUTH ---------- */
const T={
 login:["Ci Chat's",'Masuk dengan email dan password.','Masuk'],
 signup:['Buat akun','Pakai Gmail aktif. Kami kirim tautan verifikasi.','Daftar'],
 forgot:['Lupa password','Tautan reset akan dikirim ke email kamu.','Kirim tautan reset'],
 recovery:['Password baru','Masukkan password baru untuk akunmu.','Simpan password'],
 verify:['Verifikasi email','Klik tautan di email, lalu masuk. Belum menerima email?','Kirim ulang email']
};
function setMode(m){
 mode=m;
 document.querySelectorAll('[data-m]').forEach(e=>e.classList.toggle('hide',!e.dataset.m.split(' ').includes(m)));
 const [t,s,b]=T[m];
 $('#at').textContent=t;$('#as').textContent=s;$('#ab').textContent=b;
 $('#ae').textContent='';$('#ao').textContent='';
}
document.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();setMode(a.dataset.go);});

$('#af').onsubmit=async e=>{
 e.preventDefault();
 const email=$('#email').value.trim(),pass=$('#pass').value,btn=$('#ab');
 $('#ae').textContent='';$('#ao').textContent='';btn.disabled=true;
 const home=location.href.split('#')[0];
 try{
  if(mode==='login'){
   const {error}=await sb.auth.signInWithPassword({email,password:pass});
   if(error)throw error;
  }else if(mode==='signup'){
   const nick=$('#nick').value.trim(),uid=$('#uid').value.trim().toLowerCase();
   if(!nick)throw new Error('Isi nickname.');
   if(!/^[a-z0-9_]{3,20}$/.test(uid))throw new Error('ID harus 3–20 karakter: huruf kecil, angka, atau _.');
   if(!email.toLowerCase().endsWith('@gmail.com'))throw new Error('Gunakan alamat Gmail.');
   if(pass.length<6)throw new Error('Password minimal 6 karakter.');
   const {data:free}=await sb.rpc('is_uid_free',{p:uid});
   if(!free)throw new Error('ID sudah dipakai. Pilih ID lain.');
   const {error}=await sb.auth.signUp({email,password:pass,options:{data:{nickname:nick,uid_code:uid},emailRedirectTo:home}});
   if(error)throw error;
   setMode('verify');
   $('#ao').textContent='Email verifikasi sudah dikirim. Cek inbox atau folder spam.';
  }else if(mode==='forgot'){
   const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:home});
   if(error)throw error;
   $('#ao').textContent='Tautan reset sudah dikirim ke email kamu.';
  }else if(mode==='recovery'){
   if(pass.length<6)throw new Error('Password minimal 6 karakter.');
   const {error}=await sb.auth.updateUser({password:pass});
   if(error)throw error;
   recovering=false;
   await sb.auth.signOut();
   setMode('login');
   $('#ao').textContent='Password sudah diganti. Silakan masuk.';
  }else if(mode==='verify'){
   const {error}=await sb.auth.resend({type:'signup',email});
   if(error)throw error;
   $('#ao').textContent='Email verifikasi dikirim ulang.';
  }
 }catch(err){$('#ae').textContent=humanErr(err);}
 finally{btn.disabled=false;}
};

sb.auth.onAuthStateChange(async (ev,session)=>{
 if(ev==='PASSWORD_RECOVERY'){recovering=true;setMode('recovery');return;}
 if(session&&!recovering)enterApp(session.user);
 if(!session)leaveApp();
});

async function enterApp(user){
 if(me?.id===user.id)return;
 const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(error||!data){toast('Profil tidak ditemukan. Coba masuk lagi.');await sb.auth.signOut();return;}
 me=user;profile=data;
 applyTheme(profile.theme);renderMe();applyWall();
 $('#auth').classList.add('hide');$('#app').classList.remove('hide');
 connect();
 await loadChats();
}
function leaveApp(){
 me=null;profile=null;curId=null;curOther=null;msgs=new Map();convs=[];online.clear();pendingHTML='';pendingWall=null;
 if(chan){sb.removeChannel(chan);chan=null;}
 document.documentElement.style.setProperty('--wall','none');
 document.body.classList.remove('chatopen');
 $('#chat').classList.add('hide');$('#empty').classList.remove('hide');
 $('#modal').classList.add('hide');$('#app').classList.add('hide');$('#auth').classList.remove('hide');
 setMode('login');
}
$('#logout').onclick=()=>sb.auth.signOut();

/* ---------- REALTIME: pesan, online, mengetik ---------- */
function connect(){
 chan=sb.channel('cichat',{config:{presence:{key:me.id}}})
  .on('presence',{event:'sync'},()=>{
    const was=curOther&&online.has(curOther.id);
    online.clear();Object.keys(chan.presenceState()).forEach(k=>online.add(k));
    if(curOther&&was&&!online.has(curOther.id))curOther.last_seen=new Date().toISOString();
    renderList();renderStatus();
  })
  .on('broadcast',{event:'typing'},({payload})=>{
    if(payload.conv!==curId||payload.uid===me.id)return;
    typingOn=true;renderStatus();
    clearTimeout(typingT);typingT=setTimeout(()=>{typingOn=false;renderStatus();},3000);
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},onMsg)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},onMsg)
  .subscribe(async s=>{if(s==='SUBSCRIBED')await chan.track({at:Date.now()});});
}
async function markDelivered(id){
 await sb.from('messages').update({delivered_at:new Date().toISOString()}).eq('id',id).is('delivered_at',null);
}
function onMsg(p){
 const m=p.new;
 if(m.sender_id!==me.id&&!m.delivered_at)markDelivered(m.id);
 if(m.conversation_id===curId){
  msgs.set(m.id,m);
  renderMsgs(m.sender_id===me.id);
  if(m.sender_id!==me.id&&!m.read_at&&!document.hidden)markRead();
 }
 scheduleList();
}
const scheduleList=()=>{clearTimeout(lt);lt=setTimeout(loadChats,350);};

async function loadChats(){
 if(!me)return;
 await sb.from('messages').update({delivered_at:new Date().toISOString()}).neq('sender_id',me.id).is('delivered_at',null);
 const [c,m]=await Promise.all([
  sb.from('conversations').select('id,created_at,user_a,user_b,a:profiles!user_a(id,nickname,uid_code,avatar_path,last_seen),b:profiles!user_b(id,nickname,uid_code,avatar_path,last_seen)'),
  sb.from('messages').select('id,conversation_id,sender_id,kind,body,created_at,read_at,delivered_at').order('created_at',{ascending:false}).limit(500)
 ]);
 const all=m.data||[];
 convs=(c.data||[]).map(x=>{
  const ms=all.filter(y=>y.conversation_id===x.id);
  return{id:x.id,other:x.user_a===me.id?x.b:x.a,last:ms[0],unread:ms.filter(y=>y.sender_id!==me.id&&!y.read_at).length,t:ms[0]?.created_at||x.created_at};
 }).sort((p,q)=>q.t.localeCompare(p.t));
 renderList();
}
function renderList(){
 $('#list').innerHTML=convs.map(c=>`<div class="item${c.id===curId?' on':''}" data-id="${c.id}">
  <div class="wrap">${av(c.other)}${online.has(c.other.id)?'<i class="dot"></i>':''}</div>
  <div class="grow">
   <div class="row sb"><b class="trunc">${esc(c.other.nickname)}</b><span class="sm muted">${c.last?short(c.last.created_at):''}</span></div>
   <div class="row sb"><span class="sm muted trunc">${esc(preview(c.last))}</span>${c.unread?`<span class="badge">${c.unread}</span>`:''}</div>
  </div></div>`).join('')||'<p class="pad muted">Belum ada chat. Cari teman lewat ID atau nickname di atas.</p>';
}
$('#list').onclick=e=>{const it=e.target.closest('[data-id]');if(it)openChat(it.dataset.id);};

/* ---------- CARI TEMAN & MULAI CHAT ---------- */
$('#search').oninput=e=>{
 clearTimeout(stm);
 const q=e.target.value.trim();
 if(!q){$('#results').innerHTML='';return;}
 stm=setTimeout(async()=>{
  const {data,error}=await sb.rpc('search_users',{q});
  if(error)return toast(humanErr(error));
  $('#results').innerHTML=(data||[]).map(p=>`<div class="item"><div class="wrap">${av(p)}</div>
   <div class="grow"><b class="trunc">${esc(p.nickname)}</b><div class="sm muted">ID: ${esc(p.uid_code)}</div></div>
   <button class="btn sm" data-start="${p.id}">Chat</button></div>`).join('')||'<p class="pad muted">Tidak ada yang cocok.</p>';
 },300);
};
$('#results').onclick=async e=>{
 const id=e.target.dataset.start;if(!id)return;
 const {data,error}=await sb.rpc('start_chat',{other:id});
 if(error)return toast(humanErr(error));
 $('#search').value='';$('#results').innerHTML='';
 await loadChats();
 openChat(data);
};

/* ---------- CHAT ---------- */
async function openChat(id){
 const c=convs.find(x=>x.id===id);if(!c)return;
 curId=id;curOther=c.other;msgs=new Map();pendingHTML='';typingOn=false;
 document.body.classList.add('chatopen');
 $('#empty').classList.add('hide');$('#chat').classList.remove('hide');
 $('#hav').innerHTML=av(curOther);$('#hname').textContent=curOther.nickname;
 const {data}=await sb.from('messages').select('*').eq('conversation_id',id).order('created_at',{ascending:false}).limit(300);
 if(curId!==id)return;
 (data||[]).reverse().forEach(m=>msgs.set(m.id,m));
 renderMsgs(true);renderStatus();renderList();markRead();
}
$('#back').onclick=()=>{
 curId=null;curOther=null;
 document.body.classList.remove('chatopen');
 $('#chat').classList.add('hide');$('#empty').classList.remove('hide');renderList();
};
async function markRead(){
 if(!curId||!me||document.hidden)return;
 const now=new Date().toISOString();
 await sb.from('messages').update({read_at:now,delivered_at:now}).eq('conversation_id',curId).neq('sender_id',me.id).is('read_at',null);
}
function renderStatus(){
 if(!curOther)return;
 const el=$('#status'),on=online.has(curOther.id);
 el.classList.toggle('isOn',on&&!typingOn);
 el.textContent=typingOn?'sedang mengetik...':on?'online':curOther.last_seen?'terakhir dilihat '+seen(curOther.last_seen):'offline';
}
const TK_ONE='<path d="M1.5 6.5 5 10 11.5 2.5"/>';
const TK_TWO='<path d="M1.5 6.5 5 10 11.5 2.5"/><path d="M5.5 6.5 9 10 15.5 2.5"/>';
function tick(m){
 if(m.sender_id!==me.id)return '';
 const s=m.read_at?'rd':m.delivered_at?'dv':'sn';
 const color=s==='rd'?'var(--rd)':'var(--tk)';
 return `<svg class="tk" viewBox="0 0 17 12" style="color:${color}">${s==='sn'?TK_ONE:TK_TWO}</svg>`;
}
function bubble(m){
 const mine=m.sender_id===me.id;
 const body=m.kind==='image'?`<img class="media" data-path="${esc(m.storage_path)}" alt="Foto" onclick="window.open(this.src)">`
  :`<div>${esc(m.body)}</div>`;
 return `<div class="bub ${mine?'mine':'theirs'}">${body}<div class="meta">${hm(m.created_at)}${tick(m)}</div></div>`;
}
function renderMsgs(bottom){
 const b=$('#msgs');
 const near=b.scrollHeight-b.scrollTop-b.clientHeight<120;
 let html='',last='';
 [...msgs.values()].sort((x,y)=>x.created_at.localeCompare(y.created_at)).forEach(m=>{
  const k=new Date(m.created_at).toDateString();
  if(k!==last){html+=`<div class="day">${dayLabel(m.created_at)}</div>`;last=k;}
  html+=bubble(m);
 });
 b.innerHTML=html+pendingHTML;
 hydrate();
 if(bottom||near)b.scrollTop=b.scrollHeight;
}
async function hydrate(){
 for(const el of document.querySelectorAll('[data-path]:not([src])')){
  const p=el.dataset.path;let u=urlCache.get(p);
  if(!u){
   const {data}=await sb.storage.from('chat-media').createSignedUrl(p,3600);
   if(!data)continue;
   u=data.signedUrl;urlCache.set(p,u);
  }
  el.src=u;
 }
}
$('#composer').onsubmit=async e=>{
 e.preventDefault();
 const inp=$('#txt'),t=inp.value.trim();
 if(!t||!curId)return;
 inp.value='';
 const {data,error}=await sb.from('messages').insert({conversation_id:curId,sender_id:me.id,kind:'text',body:t}).select().single();
 if(error){inp.value=t;return toast('Pesan gagal dikirim: '+error.message);}
 msgs.set(data.id,data);renderMsgs(true);scheduleList();
};
$('#txt').oninput=()=>{
 const n=Date.now();
 if(curId&&chan&&n-lastT>2000){lastT=n;chan.send({type:'broadcast',event:'typing',payload:{conv:curId,uid:me.id}});}
};

/* ---------- EMOJI ---------- */
$('#emo').innerHTML=EMOJI.map(x=>`<button type="button">${x}</button>`).join('');
$('#btn-emo').onclick=()=>$('#emo').classList.toggle('hide');
$('#emo').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 const t=$('#txt'),s=t.selectionStart??t.value.length,ins=b.textContent;
 t.value=t.value.slice(0,s)+ins+t.value.slice(t.selectionEnd??s);
 t.focus();t.setSelectionRange(s+ins.length,s+ins.length);
};

/* ---------- KIRIM FOTO ---------- */
$('#btn-clip').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)sendImage(f);};
async function sendImage(f){
 if(!curId)return;
 if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)||f.size>10*1048576)return toast('Pilih foto JPG, PNG, WEBP, atau GIF maksimal 10 MB.');
 const cid=curId,path=`${cid}/${crypto.randomUUID()}.${f.type.split('/')[1].replace('jpeg','jpg')}`;
 pendingHTML='<div class="bub mine">Mengunggah…</div>';renderMsgs(true);
 try{
  const {error:e1}=await sb.storage.from('chat-media').upload(path,f,{contentType:f.type});
  pendingHTML='';
  if(e1){renderMsgs();return toast('Gagal mengunggah: '+e1.message);}
  const {data,error:e2}=await sb.from('messages').insert({conversation_id:cid,sender_id:me.id,kind:'image',storage_path:path}).select().single();
  if(e2){renderMsgs();return toast('Gagal mengirim: '+e2.message);}
  if(curId===cid)msgs.set(data.id,data);
  renderMsgs(true);scheduleList();
 }catch(err){pendingHTML='';renderMsgs();toast('Gagal mengirim: '+err.message);}
}

/* ---------- PROFIL ---------- */
function applyTheme(t){document.documentElement.dataset.theme=t==='dark'?'dark':'light';}
async function setTheme(t){
 applyTheme(t);
 if(!me)return;
 profile.theme=t;renderMe();
 await sb.from('profiles').update({theme:t}).eq('id',me.id);
}
$('#theme').onclick=()=>setTheme(profile.theme==='dark'?'light':'dark');
$('#p-theme').onclick=e=>{const b=e.target.closest('[data-t]');if(b)setTheme(b.dataset.t);};
function renderMe(){
 $('#me-av').innerHTML=av(profile);$('#p-av').innerHTML=av(profile);
 $('#me-name').textContent=profile.nickname;
 $('#me-id').textContent='ID: '+profile.uid_code;
 document.querySelectorAll('#p-theme button').forEach(b=>b.classList.toggle('on',b.dataset.t===profile.theme));
}
const openProfile=()=>{
 if(!profile)return;
 $('#p-nick').value=profile.nickname;$('#p-uid').value=profile.uid_code;
 $('#w-choice').classList.add('hide');pendingWall=null;
 $('#modal').classList.remove('hide');
};
$('#me-av').onclick=openProfile;
$('#mx').onclick=()=>$('#modal').classList.add('hide');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.add('hide');};
$('#p-pick').onclick=()=>$('#p-file').click();
$('#p-file').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';
 if(!f)return;
 if(!/^image\//.test(f.type)||f.size>2*1048576)return toast('Pilih gambar maksimal 2 MB.');
 const path=`${me.id}/avatar-${Date.now()}.${f.type.split('/')[1].replace('jpeg','jpg')}`;
 const {error:e1}=await sb.storage.from('avatars').upload(path,f,{contentType:f.type});
 if(e1)return toast(e1.message);
 const {error:e2}=await sb.from('profiles').update({avatar_path:path}).eq('id',me.id);
 if(e2)return toast(e2.message);
 profile.avatar_path=path;renderMe();toast('Foto profil diperbarui.');
};
$('#p-nick-save').onclick=async()=>{
 const n=$('#p-nick').value.trim();
 if(!n)return toast('Nickname tidak boleh kosong.');
 const {error}=await sb.from('profiles').update({nickname:n}).eq('id',me.id);
 if(error)return toast(humanErr(error));
 profile.nickname=n;renderMe();toast('Nickname disimpan.');
};
$('#p-uid-save').onclick=async()=>{
 const u=$('#p-uid').value.trim().toLowerCase();
 if(!u||u===profile.uid_code)return;
 const {error}=await sb.rpc('change_uid',{new_code:u});
 if(error)return toast(uidErr(error));
 profile.uid_code=u;renderMe();toast('ID berhasil diganti.');
};

/* ---------- WALLPAPER ---------- */
$('#w-pick').onclick=()=>$('#w-file').click();
$('#w-file').onchange=e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)||f.size>5*1048576)return toast('Pilih gambar JPG, PNG, WEBP, atau GIF maksimal 5 MB.');
 pendingWall=f;$('#w-choice').classList.remove('hide');
};
$('#w-cancel').onclick=()=>{pendingWall=null;$('#w-choice').classList.add('hide');};
document.querySelectorAll('[data-wb]').forEach(b=>b.onclick=()=>saveWall(b.dataset.wb==='1'));
async function saveWall(blur){
 const f=pendingWall;if(!f||!me)return;
 const path=`${me.id}/wall-${Date.now()}.${f.type.split('/')[1].replace('jpeg','jpg')}`;
 const {error:e1}=await sb.storage.from('wallpapers').upload(path,f,{contentType:f.type});
 if(e1)return toast('Gagal menyimpan wallpaper: '+e1.message);
 const old=profile.wallpaper_path;
 const {error:e2}=await sb.from('profiles').update({wallpaper_path:path,wallpaper_blur:blur}).eq('id',me.id);
 if(e2)return toast(e2.message);
 if(old)await sb.storage.from('wallpapers').remove([old]);
 pendingWall=null;$('#w-choice').classList.add('hide');
 profile.wallpaper_path=path;profile.wallpaper_blur=blur;
 await applyWall();toast('Wallpaper diperbarui.');
}
$('#w-clear').onclick=async()=>{
 const old=profile.wallpaper_path;
 if(!old)return toast('Belum ada wallpaper.');
 const {error}=await sb.from('profiles').update({wallpaper_path:null,wallpaper_blur:false}).eq('id',me.id);
 if(error)return toast(error.message);
 await sb.storage.from('wallpapers').remove([old]);
 profile.wallpaper_path=null;profile.wallpaper_blur=false;
 await applyWall();toast('Wallpaper dihapus.');
};
async function applyWall(){
 const st=document.documentElement.style;
 if(!profile?.wallpaper_path){st.setProperty('--wall','none');st.setProperty('--wblur','none');return;}
 const {data}=await sb.storage.from('wallpapers').createSignedUrl(profile.wallpaper_path,86400);
 if(!data)return;
 st.setProperty('--wall',`url("${data.signedUrl}")`);
 st.setProperty('--wblur',profile.wallpaper_blur?'blur(14px) brightness(.92)':'none');
}

/* ---------- HEARTBEAT: terakhir dilihat ---------- */
async function beat(){if(me)await sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',me.id);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)beat();else{markRead();beat();}});
window.addEventListener('pagehide',beat);
setInterval(()=>{if(!document.hidden)beat();},60000);

setMode('login');
</script>
</body>
</html>
